excluded:
  - identeam/build

disabled_rules:
  - opening_brace
  - closure_parameter_position # allow swift-format to wrap closure parameters
  - trailing_comma
  - todo # allow // TODO
  - function_body_length
  - force_try # allow try!
  - function_parameter_count # allow more f parameters
  - multiple_closures_with_trailing_closure # allow anonymous closures, e.g. .sheet(item:onDismiss:) {...} instead of .sheet(item:onDismiss:content:)

identifier_name:
  min_length: 1 # allow e.g. x
  excluded:
    - vm # allow variable name
    - id
