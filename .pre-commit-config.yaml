repos:
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -w
        language: system
        types: [go]

      - id: go-vet
        name: go vet
        entry: bash -c 'cd backend && go vet ./...'
        language: system
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint
        entry: bash -c 'cd backend && golangci-lint run ./...'
        language: system
        pass_filenames: false

      - id: go-test
        name: go test
        entry: bash -c 'cd backend && go test ./...'
        language: system
        pass_filenames: false